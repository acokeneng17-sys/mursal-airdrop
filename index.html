<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MURSAL TOKEN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: #000; color: #fff; font-family: Arial; margin: 0; padding-bottom: 80px; }
   .header { display: flex; justify-content: space-between; padding: 15px; align-items: center; }
   .box { background: #111; border: 2px solid #00ff88; border-radius: 15px; padding: 10px 15px; text-align: center; }
   .box.title { color: #00ff88; font-size: 12px; }
   .box.value { color: #ffff00; font-size: 18px; font-weight: bold; }
   .lang-btn { background: #00ff88; color: #000; border: none; padding: 5px 8px; border-radius: 8px; font-weight: bold; font-size: 12px; }
    h1 { text-align: center; color: #fff; }
   .circle { width: 200px; height: 200px; background: #000; border: 5px solid #00ff88; border-radius: 50%; margin: 20px auto; box-shadow: 0 0 30px #00ff88; }
   .btn { background: linear-gradient(90deg, #00ff88, #ffff00); color: #000; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 15px; width: 80%; display: block; margin: 10px auto; cursor: pointer; }
   .btn:disabled { background: #333; color: #777; }
   .timer { text-align: center; color: #ffff00; font-size: 16px; }
   .navbar { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 10px 0; border-top: 2px solid #00ff88; }
   .nav-item { text-align: center; color: #888; font-size: 12px; cursor: pointer; }
   .nav-item.active { color: #00ff88; }
   .page { display: none; padding: 20px; }
   .page.active { display: block; }
   .card { background: #111; border: 1px solid #00ff88; border-radius: 15px; padding: 15px; margin: 10px 0; }
    
    /* BARU V3.2 */
    @keyframes spin { 0% {transform: rotate(0deg);} 100% {transform: rotate(360deg);} }
   .circle.mining { animation: spin 4s linear infinite; }
   .progress-bar { width: 100%; background: #222; border-radius: 10px; margin: 10px 0; }
   .progress { height: 10px; background: linear-gradient(90deg, #00ff88, #ffff00); border-radius: 10px; }
  </style>
</head>
<body>

<div class="header">
  <div class="box"><div class="title" data-id="SALDO MSL" data-en="MSL BALANCE" data-in="एमएसएल बैलेंस" data-ru="БАЛАНС MSL" data-kr="MSL 잔액">SALDO MSL</div><div class="value" id="saldo">0</div></div>
  <button class="lang-btn" onclick="nextLang()">ID</button>
  <div class="box"><div class="title" data-id="SPEED" data-en="SPEED" data-in="गति" data-ru="СКОРОСТЬ" data-kr="속도">SPEED</div><div class="value" id="speed">Lv.1</div></div>
</div>

<div id="home" class="page active">
  <h1 data-id="MURSAL TOKEN" data-en="MURSAL TOKEN" data-in="मुर्सल टोकन" data-ru="ТОКЕН MURSAL" data-kr="머설 토큰">MURSAL TOKEN</h1>
  <div class="circle"></div>
  <button class="btn" id="btnMine">START MINING</button>
  <p class="timer" id="timer">Belum Mining</p>
  <div class="card">
    <h3 data-id="Upgrade Mining" data-en="Upgrade Mining" data-in="माइनिंग अपग्रेड" data-ru="УЛУЧШЕНИЕ МАЙНИНГА" data-kr="채굴 업그레이드">Upgrade Mining</h3>
    <p id="upgradeInfo">Lv.1: 100 MSL / 4 Jam</p>
    <button class="btn" id="btnUpgrade" onclick="upgrade()">Upgrade ke Lv.2 - 500 MSL</button>
  </div>
</div>

<div id="earn" class="page">
  <h1 data-id="TUGAS" data-en="TASKS" data-in="कार्य" data-ru="ЗАДАНИЯ" data-kr="작업">TUGAS</h1>
  <div class="card">
    <p>📢 Join Channel Telegram</p>
    <button class="btn" onclick="claimTask('telegram', 100)">Claim 100 MSL</button>
  </div>
  <div class="card">
    <p>🐦 Follow Twitter @MURSAL</p>
    <button class="btn" onclick="claimTask('twitter', 100)">Claim 100 MSL</button>
  </div>
</div>

<div id="friends" class="page">
  <h1 data-id="REFERRAL" data-en="REFERRAL" data-in="रेफ़रल" data-ru="РЕФЕРАЛ" data-kr="추천">REFERRAL</h1>
  <div class="card">
    <p data-id="Ajak teman dapat 500 MSL" data-en="Invite friends get 500 MSL" data-in="दोस्तों को आमंत्रित करें और 500 MSL पाएं" data-ru="Пригласи друзей и получи 500 MSL" data-kr="친구를 초대하고 500 MSL 받기">Ajak teman dapat 500 MSL</p>
    <p id="refLink" style="word-break: break-all; font-size: 12px;"></p>
    <button class="btn" onclick="copyRef()" data-id="Copy Link" data-en="Copy Link" data-in="लिंक कॉपी करें" data-ru="КОПИРОВАТЬ ССЫЛКУ" data-kr="링크 복사">Copy Link</button>
  </div>
</div>

<div id="wallet" class="page"><h1 data-id="WALLET" data-en="WALLET" data-in="वॉलेट" data-ru="КОШЕЛЕК" data-kr="지갑">WALLET</h1><p>Coming Soon</p></div>

<div class="navbar">
  <div class="nav-item active" onclick="openPage('home')">🏠<br><span data-id="Home" data-en="Home" data-in="होम" data-ru="ГЛАВНАЯ" data-kr="홈">Home</span></div>
  <div class="nav-item" onclick="openPage('earn')">🎁<br><span data-id="Earn" data-en="Earn" data-in="कमाएं" data-ru="ЗАРАБОТАТЬ" data-kr="수익">Earn</span></div>
  <div class="nav-item" onclick="openPage('friends')">👥<br><span data-id="Friends" data-en="Friends" data-in="दोस्त" data-ru="ДРУЗЬЯ" data-kr="친구">Friends</span></div>
  <div class="nav-item" onclick="openPage('wallet')">👛<br><span data-id="Wallet" data-en="Wallet" data-in="वॉलेट" data-ru="КОШЕЛЕК" data-kr="지갑">Wallet</span></div>
</div>

<script>
let tg = window.Telegram.WebApp; tg.expand();
let langs = ['id', 'en', 'in', 'ru', 'kr'];
let langIndex = 0;
let lang = 'id';
  let claimedTasks = JSON.parse(localStorage.getItem('claimed_tasks')) || [];
let data = JSON.parse(localStorage.getItem('mursal_data')) || {saldo: 15, miningStart: 0, level: 1};
if(!data.level) data.level = 1;

const LEVELS = [
  {rate: 100, cost: 500, desc: "Pemula"},
  {rate: 200, cost: 2000, desc: "Pro"},
  {rate: 400, cost: 10000, desc: "Master"}
];
const DURATION = 4 * 60 * 60 * 1000;
const BOT_USERNAME = "mursalairdrop_bot"; // PENTING: GANTI INI

const TEXT = {
  ready: {id:"SIAP DI CLAIM!", en:"READY TO CLAIM!", in:"दावा करने के लिए तैयार!", ru:"ГОТОВ К ЗАЯВКЕ!", kr:"수령 가능!"},
  mining: {id:"SEDANG MINING...", en:"MINING...", in:"माइनिंग चल रही है...", ru:"МАЙНИНГ...", kr:"채굴 중..."},
  claimIn: {id:"Claim dalam", en:"Claim in", in:"में दावा", ru:"Забрать через", kr:"수령까지"},
  upgradeSuccess: {id:"Upgrade Berhasil!", en:"Upgrade Success!", in:"अपग्रेड सफल!", ru:"УСПЕШНОЕ УЛУЧШЕНИЕ!", kr:"업그레이드 성공!"},
  linkCopied: {id:"Link disalin!", en:"Link Copied!", in:"लिंक कॉपी किया गया!", ru:"ССЫЛКА СКОПИРОВАНА!", kr:"링크 복사됨!"},
  refBonus: {id:"Kamu dapat bonus 500 MSL dari referral!", en:"You got 500 MSL referral bonus!", in:"आपको रेफरल बोनस 500 MSL मिला!", ru:"Вы получили бонус 500 MSL за реферала!", kr:"추천 보너스 500 MSL를 받았습니다!"},
  startMine: {id:"START MINING", en:"START MINING", in:"माइनिंग शुरू करें", ru:"НАЧАТЬ МАЙНИНГ", kr:"채굴 시작"},
  taskDone: {id:"Tugas Selesai! +100 MSL", en:"Task Done! +100 MSL", in:"कार्य पूरा! +100 MSL", ru:"Задание выполнено! +100 MSL", kr:"작업 완료! +100 MSL"}
}

function save() { localStorage.setItem('mursal_data', JSON.stringify(data)); }

function nextLang() {
  langIndex = (langIndex + 1) % langs.length;
  lang = langs[langIndex];
  document.querySelector('.lang-btn').innerText = lang.toUpperCase();
  updateUI();
}

function openPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  event.currentTarget.classList.add('active');
}

function claimTask(taskId, reward) {
  if(claimedTasks.includes(taskId)) {
    alert("Tugas ini sudah diklaim!");
    return;
  }
  claimedTasks.push(taskId);
  localStorage.setItem('claimed_tasks', JSON.stringify(claimedTasks));
  
  data.saldo += reward;
  save(); updateUI();
  alert(`${TEXT.taskDone[lang]}`);
  
  // Bikin tombol jadi abu-abu
  event.target.disabled = true;
  event.target.innerText = "Sudah Diklaim";
  event.target.style.background = "#333";
}

function updateUI() {
  document.getElementById('saldo').innerText = data.saldo;
  document.getElementById('speed').innerText = `Lv.${data.level}`;
  let currentLevel = LEVELS[data.level - 1];
  
  document.getElementById('upgradeInfo').innerHTML = `
    Lv.${data.level}: ${currentLevel.rate} MSL / 4 Jam<br>
    <small>Rank: ${currentLevel.desc}</small>
    <div class="progress-bar"><div class="progress" style="width:${(data.level/LEVELS.length)*100}%"></div></div>
  `;
  
  if(data.level < LEVELS.length) {
    let next = LEVELS[data.level];
    document.getElementById('btnUpgrade').innerText = `Upgrade ke Lv.${data.level + 1} - ${next.cost} MSL`;
    document.getElementById('btnUpgrade').disabled = data.saldo < next.cost;
  } else {
    document.getElementById('btnUpgrade').innerText = "MAX LEVEL";
    document.getElementById('btnUpgrade').disabled = true;
  }

  let circle = document.querySelector('.circle');
  if(data.miningStart > 0) {
    let diff = (data.miningStart + DURATION) - new Date().getTime();
    if(diff <= 0) {
      document.getElementById('timer').innerText = TEXT.ready[lang];
      document.getElementById('btnMine').innerText = `CLAIM ${currentLevel.rate} MSL`;
      circle.classList.remove('mining');
    } else {
      let h = String(Math.floor(diff / 3600000)).padStart(2,'0');
      let m = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
      let s = String(Math.floor((diff % 60000) / 1000)).padStart(2,'0');
      document.getElementById('timer').innerText = `${TEXT.claimIn[lang]} ${h}:${m}:${s}`;
      document.getElementById('btnMine').innerText = TEXT.mining[lang];
      circle.classList.add('mining');
    }
  } else {
    document.getElementById('timer').innerText = lang === 'id'? "Tekan tombol untuk mulai mining" : "Press button to start mining";
    document.getElementById('btnMine').innerText = TEXT.startMine[lang];
    circle.classList.remove('mining');
  }
  
  document.querySelectorAll(`[data-${lang}]`).forEach(el => {
    el.innerText = el.getAttribute(`data-${lang}`);
  });
  
  document.getElementById('refLink').innerText = `https://t.me/${BOT_USERNAME}?start=ref_${tg.initDataUnsafe.user?.id || 123}`;
}

document.getElementById('btnMine').onclick = () => {
  let now = new Date().getTime();
  let currentRate = LEVELS[data.level - 1].rate;
  if(data.miningStart === 0) { data.miningStart = now; } 
  else if(now >= data.miningStart + DURATION) { data.saldo += currentRate; data.miningStart = now; }
  save(); updateUI();
}

function upgrade() {
  let nextLevel = LEVELS[data.level];
  if(data.saldo >= nextLevel.cost) {
    data.saldo -= nextLevel.cost;
    data.level += 1;
    save(); updateUI();
    alert(TEXT.upgradeSuccess[lang]);
  }
}

function copyRef() {
  navigator.clipboard.writeText(document.getElementById('refLink').innerText);
  alert(TEXT.linkCopied[lang]);
}

if(tg.initDataUnsafe.start_param && tg.initDataUnsafe.start_param.startsWith('ref_')) {
  if(!localStorage.getItem('ref_claimed')) {
    data.saldo += 500;
    localStorage.setItem('ref_claimed', 'true');
    save();
    alert(TEXT.refBonus[lang]);
  }
}

setInterval(updateUI, 1000); updateUI();
</script>
</body>
</html>
