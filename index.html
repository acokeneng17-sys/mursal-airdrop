<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MURSAL TOKEN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: #000; color: #fff; font-family: Arial; margin: 0; padding-bottom: 80px; }
    .header { display: flex; justify-content: space-between; padding: 15px; }
    .box { background: #111; border: 2px solid #00ff88; border-radius: 15px; padding: 10px 20px; text-align: center; }
    .box .title { color: #00ff88; font-size: 12px; }
    .box .value { color: #ffff00; font-size: 20px; font-weight: bold; }
    h1 { text-align: center; color: #fff; }
    .circle { width: 200px; height: 200px; background: #000; border: 5px solid #00ff88; border-radius: 50%; margin: 20px auto; box-shadow: 0 0 30px #00ff88; }
    .btn { background: linear-gradient(90deg, #00ff88, #ffff00); color: #000; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 15px; width: 80%; display: block; margin: 20px auto; }
    .timer { text-align: center; color: #ffff00; }
    .navbar { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 10px 0; border-top: 2px solid #00ff88; }
    .nav-item { text-align: center; color: #888; font-size: 12px; cursor: pointer; }
    .nav-item.active { color: #00ff88; }
    .page { display: none; padding: 20px; text-align: center; }
    .page.active { display: block; }
  </style>
</head>
<body>

<div id="home" class="page active">
  <div class="header">
    <div class="box"><div class="title">SALDO MSL</div><div class="value" id="saldo">15</div></div>
    <div class="box"><div class="title">ENERGY</div><div class="value">100/100</div></div>
  </div>
  <h1>MURSAL TOKEN</h1>
  <div class="circle"></div>
  <button class="btn" id="btnMine">START MINING</button>
  <p class="timer" id="timer">Belum Mining</p>
</div>

<div id="earn" class="page"><h1>TUGAS</h1><p>Coming Soon</p></div>
<div id="friends" class="page"><h1>REFERRAL</h1><p>Coming Soon</p></div>
<div id="wallet" class="page"><h1>WALLET</h1><p>Coming Soon</p></div>

<div class="navbar">
  <div class="nav-item active" onclick="openPage('home')">🏠<br>Home</div>
  <div class="nav-item" onclick="openPage('earn')">🎁<br>Earn</div>
  <div class="nav-item" onclick="openPage('friends')">👥<br>Friends</div>
  <div class="nav-item" onclick="openPage('wallet')">👛<br>Wallet</div>
</div>

<script>
let tg = window.Telegram.WebApp; tg.expand();
let data = JSON.parse(localStorage.getItem('mursal_data')) || {saldo: 15, miningStart: 0};
const RATE = 100; const DURATION = 4 * 60 * 60 * 1000;

function save() { localStorage.setItem('mursal_data', JSON.stringify(data)); }
function openPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  event.currentTarget.classList.add('active');
}

function updateUI() {
  document.getElementById('saldo').innerText = data.saldo;
  if(data.miningStart > 0) {
    let diff = (data.miningStart + DURATION) - new Date().getTime();
    if(diff <= 0) {
      document.getElementById('timer').innerText = "SIAP DI CLAIM!";
      document.getElementById('btnMine').innerText = "CLAIM 100 MSL";
    } else {
      let h = Math.floor(diff / 3600000);
      let m = Math.floor((diff % 3600000) / 60000);
      let s = Math.floor((diff % 60000) / 1000);
      document.getElementById('timer').innerText = `Claim dalam ${h}:${m}:${s}`;
      document.getElementById('btnMine').innerText = "SEDANG MINING...";
    }
  }
}

document.getElementById('btnMine').onclick = () => {
  let now = new Date().getTime();
  if(data.miningStart === 0) { data.miningStart = now; } 
  else if(now >= data.miningStart + DURATION) { data.saldo += RATE; data.miningStart = now; }
  save(); updateUI();
}

setInterval(updateUI, 1000); updateUI();
</script>
</body>
</html>
<div id="friends" class="page">
  <h1>REFERRAL</h1>
  <p>Ajak teman dapat 500 MSL</p>
  <button onclick="copyLink()">Copy Link Referral</button>
</div>
<div id="wallet" class="page">
  <h1>WALLET</h1>
  <p>Hubungkan Wallet TON</p>
  <button>Connect Wallet</button>
</div>
