<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- SDK Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS untuk tampilan -->
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Mini App Saya</title>
</head>
<body class="bg-slate-900 text-white flex flex-col items-center justify-between min-h-screen p-6">

  <!-- Header Ringkas -->
  <div class="w-full text-center mt-4">
    <h1 class="text-xl font-bold text-amber-400">ASTEROID MINER</h1>
    <p class="text-xs text-gray-400">Level 1</p>
  </div>

  <!-- Tombol Tambang / Koin -->
  <div class="flex flex-col items-center">
    <button id="tapBtn" class="bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-2xl w-40 h-40 rounded-full shadow-lg shadow-amber-500/50 active:scale-95 transition flex items-center justify-center">
      TAP!
    </button>
    <div class="mt-6 text-center">
      <span id="score" class="text-5xl font-black">0</span>
      <p class="text-xs text-gray-400 mt-1">TOTAL POIN</p>
    </div>
  </div>

  <!-- Tombol Klaim -->
  <button onclick="alert('Poin berhasil diklaim!')" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl">
    Claim Points
  </button>

  <script>
    // Inisialisasi Telegram
    const tg = window.Telegram.WebApp;
    tg.expand(); // Bikin tampilan full screen di Telegram

    let points = 0;
    const tapBtn = document.getElementById('tapBtn');
    const scoreText = document.getElementById('score');

    tapBtn.addEventListener('click', () => {
      points += 1;
      scoreText.innerText = points;

      // Efek getar HP saat tombol ditap
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }
    });
  </script>
</body>
</html>
